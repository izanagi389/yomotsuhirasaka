# 依存の自動の更新提案（13-security.md「依存ライブラリと配布物」）。依存の追加・更新は持ち主の承認で取り込む（CODEOWNERS）。
# 提案が多すぎないよう、週に1回、種類ごとにまとめる。セキュリティの更新は、Dependabot のセキュリティの更新として別に届く。
version: 2
updates:
    - package-ecosystem: cargo
      directory: /
      schedule:
          interval: weekly
      groups:
          rust:
              patterns: ["*"]
      ignore:
          # パスキーの照合。0.6 は API が変わり、修正版のない脆弱性のある rsa（RUSTSEC-2023-0071）を連れてくる（2026-11-08）。
          # 移行は、変更点を調べてから専用の PR で行う（人間のレビューが必須の領域）
          - dependency-name: webauthn-rs
            update-types: ["version-update:semver-major", "version-update:semver-minor"]
    - package-ecosystem: npm
      # 管理画面・CLI・共有パッケージ（ルートの npm workspaces）
      directory: /
      schedule:
          interval: weekly
      groups:
          npm:
              patterns: ["*"]
    - package-ecosystem: npm
      directory: /tests/invariants
      schedule:
          interval: weekly
      groups:
          invariants:
              patterns: ["*"]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
    - package-ecosystem: docker
      directory: /deploy
      schedule:
          interval: weekly
      ignore:
          # Node の大きな版は、長期サポート（LTS）の版を選んで、CI・イメージ・確認用の環境をそろえて手で上げる
          # （奇数の版は LTS にならないため。2026-11-08）
          - dependency-name: node
            update-types: ["version-update:semver-major"]
          # PostgreSQL の大きな版は、データの移し替え（新しいボリュームへの復元）が要るので、手順を用意して手で上げる
          # （16 → 18 の自動の更新でイメージのビルドが壊れた。2026-11-13）
          - dependency-name: postgres
            update-types: ["version-update:semver-major"]
