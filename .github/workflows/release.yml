# リリース（docs/decisions/14-release.md、13-security.md「依存ライブラリと配布物」）。
# タグ `v1.0.0`・`v1.0.0-rc.1` で動く。確認（ci.yml）→ 持ち主の承認（Environment release）→ ビルドと公開 → 署名と SBOM。
# 手動の実行（workflow_dispatch）は、ビルドだけを試す（公開も署名もしない）。
# 外部のアクションはコミットのSHAで固定する。権限はジョブごとに必要な分だけにする。
name: release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read

env:
    IMAGE: ghcr.io/izanagi389/yomotsuhirasaka

jobs:
    # タグの形・main の上にあること・server/Cargo.toml の版との一致を確かめる
    guard:
        runs-on: ubuntu-24.04
        outputs:
            publish: ${{ steps.check.outputs.publish }}
            version: ${{ steps.check.outputs.version }}
            prerelease: ${{ steps.check.outputs.prerelease }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - id: check
              env:
                  REF_NAME: ${{ github.ref_name }}
                  REF_TYPE: ${{ github.ref_type }}
              run: |
                  crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' server/Cargo.toml | head -n 1)"
                  if [ "$REF_TYPE" != tag ]; then
                    echo "publish=false" >> "$GITHUB_OUTPUT"
                    echo "version=$crate-dev" >> "$GITHUB_OUTPUT"
                    echo "prerelease=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
                    echo "the tag $REF_NAME is not vX.Y.Z or vX.Y.Z-rc.N" >&2
                    exit 1
                  fi
                  version="${REF_NAME#v}"
                  if [ "$version" != "$crate" ]; then
                    echo "the tag says $version but server/Cargo.toml says $crate" >&2
                    exit 1
                  fi
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                    echo "the tag is not on main" >&2
                    exit 1
                  fi
                  echo "publish=true" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  case "$version" in
                    *-rc.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
                    *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
                  esac

    # 公開の前に、ふだんの確認をすべて流す
    ci:
        needs: guard
        if: needs.guard.outputs.publish == 'true'
        uses: ./.github/workflows/ci.yml

    # 持ち主の承認（Settings → Environments → release の Required reviewers）
    approve:
        needs: [guard, ci]
        if: needs.guard.outputs.publish == 'true'
        runs-on: ubuntu-24.04
        environment: release
        steps:
            - run: echo "approved"

    # アーキテクチャごとに、イメージ（digest で push）とバイナリを作る
    build:
        needs: [guard, ci, approve]
        # 手動の実行では ci と approve を飛ばす
        if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.guard.outputs.publish != 'true' || needs.approve.result == 'success') }}
        strategy:
            fail-fast: true
            matrix:
                include:
                    - arch: amd64
                      target: x86_64
                      runner: ubuntu-24.04
                    - arch: arm64
                      target: aarch64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        env:
            VERSION: ${{ needs.guard.outputs.version }}
            PUBLISH: ${{ needs.guard.outputs.publish }}
            TARGET: ${{ matrix.target }}
            ARCH: ${{ matrix.arch }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - if: needs.guard.outputs.publish == 'true'
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - id: image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: deploy/server.Dockerfile
                  platforms: linux/${{ matrix.arch }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.version=${{ needs.guard.outputs.version }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.licenses=Apache-2.0
                  outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.guard.outputs.publish }}
            - name: Take the binary and the admin files from the same Dockerfile
              env:
                  DIGEST: ${{ steps.image.outputs.digest }}
              run: |
                  docker buildx build --platform "linux/$ARCH" --target dist --output type=local,dest=out -f deploy/server.Dockerfile .
                  name="yomotsuhirasaka-$VERSION-linux-$TARGET"
                  mkdir -p "dist/$name"
                  cp -R out/yomi-server out/admin LICENSE "dist/$name/"
                  chmod +x "dist/$name/yomi-server"
                  tar -czf "$name.tar.gz" -C dist "$name"
                  mkdir -p upload
                  mv "$name.tar.gz" upload/
                  printf '%s' "$DIGEST" > "upload/digest-$ARCH"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: build-${{ matrix.arch }}
                  path: upload/
                  if-no-files-found: error
                  retention-days: 7

    # 2つのアーキテクチャのイメージを1つにまとめ、署名し、SBOM を attestation として付ける
    publish-image:
        needs: [guard, build]
        if: needs.guard.outputs.publish == 'true'
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
            id-token: write # 鍵なしの署名
        env:
            VERSION: ${{ needs.guard.outputs.version }}
            PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: build-*
                  merge-multiple: true
                  path: artifacts
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
            - id: manifest
              name: Make the multi-architecture image
              run: |
                  tags=(-t "$IMAGE:$VERSION")
                  # 候補の版は latest にしない
                  if [ "$PRERELEASE" = false ]; then tags+=(-t "$IMAGE:latest"); fi
                  docker buildx imagetools create "${tags[@]}" \
                    "$IMAGE@$(cat artifacts/digest-amd64)" \
                    "$IMAGE@$(cat artifacts/digest-arm64)"
                  digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')"
                  echo "digest=$digest" >> "$GITHUB_OUTPUT"
            - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
              with:
                  image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
                  format: spdx-json
                  output-file: image.spdx.json
                  upload-artifact: false
                  upload-release-assets: false
            - name: Sign the image and attach the SBOM
              env:
                  DIGEST: ${{ steps.manifest.outputs.digest }}
              run: |
                  cosign sign --yes "$IMAGE@$DIGEST"
                  cosign attest --yes --type spdxjson --predicate image.spdx.json "$IMAGE@$DIGEST"

    # バイナリの SBOM・チェックサム・署名を作り、GitHub Releases に置く
    publish-release:
        needs: [guard, build, publish-image]
        if: needs.guard.outputs.publish == 'true'
        runs-on: ubuntu-24.04
        permissions:
            contents: write # GitHub Releases
            id-token: write # 鍵なしの署名
        env:
            VERSION: ${{ needs.guard.outputs.version }}
            PRERELEASE: ${{ needs.guard.outputs.prerelease }}
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            TAG: ${{ github.ref_name }}
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: build-*
                  merge-multiple: true
                  path: artifacts
            - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
            - name: Unpack for the SBOMs
              run: |
                  mkdir -p release unpacked
                  mv artifacts/*.tar.gz release/
                  for f in release/*.tar.gz; do tar -xzf "$f" -C unpacked; done
            - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
              with:
                  path: unpacked/yomotsuhirasaka-${{ needs.guard.outputs.version }}-linux-x86_64
                  format: spdx-json
                  output-file: release/yomotsuhirasaka-${{ needs.guard.outputs.version }}-linux-x86_64.spdx.json
                  upload-artifact: false
                  upload-release-assets: false
            - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
              with:
                  path: unpacked/yomotsuhirasaka-${{ needs.guard.outputs.version }}-linux-aarch64
                  format: spdx-json
                  output-file: release/yomotsuhirasaka-${{ needs.guard.outputs.version }}-linux-aarch64.spdx.json
                  upload-artifact: false
                  upload-release-assets: false
            - name: Checksums and signatures
              working-directory: release
              run: |
                  sha256sum ./*.tar.gz ./*.spdx.json > SHA256SUMS
                  for f in ./*.tar.gz ./*.spdx.json SHA256SUMS; do
                    cosign sign-blob --yes --bundle "$f.sigstore" "$f"
                  done
            - name: Create the GitHub release
              run: |
                  flags=()
                  if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
                  gh release create "$TAG" release/* --verify-tag --generate-notes --title "$TAG" "${flags[@]}"
