# サーバーの検査と、約束のテスト（tests/invariants/）。
# 外部のアクションはコミットのSHAで固定する（13-security.md）。権限は最小（contents: read）。
name: ci

on:
    pull_request:
    push:
        branches: [main]
    # リリースのワークフローが、公開の前に呼ぶ（release.yml）
    workflow_call:

permissions:
    contents: read

jobs:
    server:
        runs-on: ubuntu-24.04
        services:
            # 検索用データのベクトルに pgvector が要る（scripts/test-env/setup.sh が拡張 vector を作る）。
            # 外部のイメージは digest で固定する（外部のアクションと同じ。13-security.md）。pg16 のタグの、マルチアーキテクチャの一覧の digest
            pg16:
                image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
                env:
                    POSTGRES_PASSWORD: ci-only-superuser-pw-16
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
        env:
            # server/tests/ のDBの結合テストが使う（なければ飛ばされる）
            YOMI_TEST_PG_SUPERUSER_URL: postgres://postgres:ci-only-superuser-pw-16@127.0.0.1:5432/postgres
            # キーワード検索の結合テスト（server/tests/keyword_search.rs）が使う。下の手順で、公式の拡張入りのイメージを起動する
            YOMI_TEST_PG_BIGM_URL: postgres://postgres:ci-only-superuser-pw-bigm@127.0.0.1:5434/postgres
            # 結合テストはファイルごとに実行ファイルができ、デバッグ情報を丸ごと入れるとランナーのディスクが足りなくなる。
            # 失敗したときの行番号だけを残す（手元の Cargo.toml の設定は変えない）
            CARGO_INCREMENTAL: "0"
            CARGO_PROFILE_DEV_DEBUG: line-tables-only
            CARGO_PROFILE_TEST_DEBUG: line-tables-only
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # パスキーの照合（webauthn-rs）が OpenSSL を使う
            - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config >/dev/null
            - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
            - run: cargo fmt --check
            - run: cargo clippy --locked --all-targets -- -D warnings
            # 依存の脆弱性・ライセンス・取得元（deny.toml。13-security.md「依存ライブラリと配布物」）。cargo-deny 0.20.2
            - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              with:
                  command: check
                  rust-version: stable
            # pg_bigm と pgvector の入った PostgreSQL（deploy/postgres.Dockerfile。公式の Docker Compose と同じイメージ）
            - run: |
                  docker build -q -t yomi-postgres-bigm -f deploy/postgres.Dockerfile deploy
                  docker run -d --name pg-bigm -e POSTGRES_PASSWORD=ci-only-superuser-pw-bigm -p 5434:5432 yomi-postgres-bigm
                  for i in $(seq 1 60); do docker exec pg-bigm pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
                  docker exec pg-bigm pg_isready -h 127.0.0.1 -U postgres
            - run: cargo test --locked

    invariants:
        runs-on: ubuntu-24.04
        services:
            # 検索用データのベクトルに pgvector が要る（scripts/test-env/setup.sh が拡張 vector を作る）。
            # 外部のイメージは digest で固定する（外部のアクションと同じ。13-security.md）。pg16 のタグの、マルチアーキテクチャの一覧の digest
            pg16:
                image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
                env:
                    POSTGRES_PASSWORD: ci-only-superuser-pw-16
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
            pg15:
                image: postgres:15
                env:
                    POSTGRES_PASSWORD: ci-only-superuser-pw-15
                ports: ["5433:5432"]
                options: >-
                    --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # パスキーの照合（webauthn-rs）が OpenSSL を使う
            - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config >/dev/null
            - run: rustup toolchain install stable --profile minimal && rustup default stable
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
            - run: cargo build --locked
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: npm
                  cache-dependency-path: |
                      tests/invariants/package-lock.json
                      package-lock.json
            # 管理画面・CLI と、それらが共有するパッケージ（ルートの npm workspaces）
            - name: Install the admin UI, the CLI and shared packages
              run: npm ci --ignore-scripts
            # 既知の脆弱性（重要度 high 以上）があれば失敗させる（13-security.md「依存ライブラリと配布物」）
            - name: Audit the npm dependencies
              run: npm audit --audit-level=high
            - name: Check where the npm packages come from
              run: node scripts/check-lockfile-sources.mjs package-lock.json tests/invariants/package-lock.json
            - name: Build and test the shared editor schema
              run: |
                  npm run typecheck -w @yomotsuhirasaka/editor-schema
                  npm test -w @yomotsuhirasaka/editor-schema
                  npm run build -w @yomotsuhirasaka/editor-schema
            # 変換器のテストは、サーバーに同梱したコピー（server/src/script/converter.js）が最新かも確かめる
            - name: Type check and test the body converter
              run: |
                  npm run typecheck -w @yomotsuhirasaka/converter
                  npm test -w @yomotsuhirasaka/converter
            # ライブプレビューのメッセージの決まり（管理画面とNuxtモジュールが使う。約束のテストが dist を読む。INV-PRV-03）
            - name: Build and test the live preview messages
              run: |
                  npm run typecheck -w @yomotsuhirasaka/preview
                  npm test -w @yomotsuhirasaka/preview
                  npm run build -w @yomotsuhirasaka/preview
            # 擬似LLM（約束のテストのハーネスが dist/main.js を別のプロセスとして起動する）
            - name: Build and test the mock LLM
              run: |
                  npm run typecheck -w @yomotsuhirasaka/mock-llm
                  npm test -w @yomotsuhirasaka/mock-llm
                  npm run build -w @yomotsuhirasaka/mock-llm
            - name: Build and test the Nuxt module
              run: |
                  npm run typecheck -w @yomotsuhirasaka/nuxt
                  npm test -w @yomotsuhirasaka/nuxt
                  npm run build -w @yomotsuhirasaka/nuxt
            # CLI（約束のテストが dist/index.js を実行する）。単体テストもここで流す
            - name: Build and test the CLI
              run: npm test -w @yomotsuhirasaka/cli
            # 管理画面はサーバーが /admin/ で配信する（INV-HDR-01 などが応答を確かめる）。v-html の禁止は eslint で検査する
            - name: Lint, type check and build the admin UI
              working-directory: admin
              run: |
                  npx nuxt prepare
                  npm run lint
                  npm run typecheck
                  npm run generate
            - name: Install test dependencies
              working-directory: tests/invariants
              run: |
                  npm ci --ignore-scripts
                  npm audit --audit-level=high
            # inv.test のゾーンだけを、テストの実行環境のDNSサーバーに回す（Webhookなどの外部への送信の確認。INV-WH-*）
            - name: Route inv.test to the test DNS server
              run: |
                  sudo apt-get install -y --no-install-recommends dnsmasq-base >/dev/null
                  sudo scripts/test-env/harness-dns.sh 5354
            - name: Prepare databases and config
              run: |
                  sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
                  scripts/test-env/setup.sh \
                    postgres://postgres:ci-only-superuser-pw-16@127.0.0.1:5432/postgres \
                    postgres://postgres:ci-only-superuser-pw-15@127.0.0.1:5433/postgres \
                    "$RUNNER_TEMP/yomi-test"
            - name: Type check
              working-directory: tests/invariants
              run: npm run typecheck
            - name: Invariant tests
              working-directory: tests/invariants
              run: |
                  . "$RUNNER_TEMP/yomi-test/test.env"
                  npm test

    # 公式の Docker Compose（deploy/）で、初期化・起動ができ、DBのポートが外に開いていないことを確かめる
    compose:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Initialize
              working-directory: deploy
              run: |
                  set -o pipefail
                  ./init.sh https://yomi.example.test 2>&1 | tee "$RUNNER_TEMP/compose.log"
            - name: Start
              working-directory: deploy
              run: |
                  set -o pipefail
                  docker compose up -d --wait --wait-timeout 600 2>&1 | tee -a "$RUNNER_TEMP/compose.log"
            - name: Smoke test
              working-directory: deploy
              run: |
                  for i in $(seq 1 60); do
                    code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/admin/me || true)"
                    [ "$code" = 401 ] && break
                    sleep 2
                  done
                  test "$code" = 401
                  # 管理画面がイメージから配信され、CSP が付いている
                  curl -sfD - -o /dev/null http://127.0.0.1:8080/admin/ | grep -qi "^content-security-policy: default-src 'self'"
                  # DBのポートはホストに開いていない
                  if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then echo "PostgreSQL is reachable from the host" >&2; exit 1; fi
                  # 拡張が入っている
                  docker compose exec -T db psql -U postgres -d yomi -Atc "SELECT string_agg(extname, ',' ORDER BY extname) FROM pg_extension" | grep -q 'pg_bigm.*vector'
                  docker compose exec -T yomi yomi-server create-server-admin --config /data/config.toml --email ci@example.test
            # 失敗したときは、ログの最後を注釈に出す（PRの画面から読めるように）
            - name: Logs
              if: failure()
              working-directory: deploy
              run: |
                  docker compose logs --no-color 2>&1 | tail -n 60 >> "$RUNNER_TEMP/compose.log" || true
                  tail -n 80 "$RUNNER_TEMP/compose.log" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > "$RUNNER_TEMP/annotation.txt"
                  echo "::error title=compose log::$(cat "$RUNNER_TEMP/annotation.txt")"
