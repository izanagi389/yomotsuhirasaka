[package]
name = "cms-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "cms_server"
path = "src/lib.rs"

[[bin]]
name = "cms-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
toml = "1.1.8"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
