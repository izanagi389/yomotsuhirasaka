[package]
name = "cms-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "cms_server"
path = "src/lib.rs"

[[bin]]
name = "cms-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
sha2 = "0.11.0"
subtle = "2.6.1"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
toml = "1.1.8"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
totp-rs = "6.0"
chacha20poly1305 = "0.11"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
maxminddb = "0.32.0"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
# webauthn-rs の型（パスキー、途中の状態）をJSONでDBに保存する（axum・webauthn-rs が既に使っているもの）
serde_json = "1.0.145"
# リンクと埋め込みのURLの解釈（WHATWGのURLの仕様どおり。webauthn-rs などが既に使っているもの）
url = "2.5"

[dev-dependencies]
# テストで、ブラウザと認証器の代わりにパスキーを作って使う
passkey-client = "0.6.0"
passkey-authenticator = { version = "0.6.0", features = ["testable"] }
passkey-types = "0.6.0"
passkey-crypto = "0.1.1"
