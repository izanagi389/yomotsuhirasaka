[package]
name = "cms-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "cms_server"
path = "src/lib.rs"

[[bin]]
name = "cms-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
oauth2 = { version = "5.0.0", default-features = false }
rand = "0.10.3"
sha2 = "0.11.0"
subtle = "2.6.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
toml = "1.1.8"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
totp-rs = "6.0"
chacha20poly1305 = "0.11"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
maxminddb = "0.32.0"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
# webauthn-rs の型（パスキー、途中の状態）をJSONでDBに保存する（axum・webauthn-rs が既に使っているもの）
serde_json = "1.0.145"
# リンクと埋め込みのURLの解釈（WHATWGのURLの仕様どおり。webauthn-rs などが既に使っているもの）
url = "2.5"
# 画像の形式の判定・デコード・エンコードし直し（Rustだけで書かれた JPEG・PNG・GIF・WebP だけを有効にする。13-security.md「メディア」、Q96, Q127）
# 配信API（GraphQL）。テンプレートの版ごとに、動的スキーマ機能でスキーマを組み立てる（02-schema-and-delivery-api.md、Q55, Q130）
async-graphql = { version = "=7.2.1", default-features = false, features = ["dynamic-schema"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# 外部へのHTTPの送信の共通の仕組み（13-security.md「外部への送信」、Q112, Q128）。
# 検査したIPアドレスに自分で接続し、その上でHTTP/1.1を送る（リダイレクトはたどらない）。
# いずれも axum・sqlx・lettre が既に使っている版。暗号の実装は ring（lettre と同じ）
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.9"
# Webhookの署名（HMAC-SHA256。13-security.md「Webhookの署名」）。sqlx が既に使っている版
hmac = "0.13.0"
# 漏えいしたパスワードの照会（HIBP の range API はパスワードの SHA-1 の先頭5文字で引く。Q170）。sqlx が既に使っている版
sha1 = "0.11.0"
# 組み込みJS（QuickJS-NG）。allocator / rust-alloc は使わない（メモリの上限が効かなくなる）。loader も使わない（import を解決させない）
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
# HTMLの無害化（変換器の出力。INV-CNV-01）。許可リストは content/html.rs
ammonia = "=4.2.3"
# 質問応答の回答の形（判定の先行宣言と引用記号）を、擬似LLMと同じ format.json の正規表現で読む（answer/format.rs）。
# rust-lang の公式。ammonia などが既に使っている版
regex = "1.13.1"

[dev-dependencies]
# テストで、ブラウザと認証器の代わりにパスキーを作って使う
passkey-client = "0.6.0"
passkey-authenticator = { version = "0.6.0", features = ["testable"] }
passkey-types = "0.6.0"
passkey-crypto = "0.1.1"
